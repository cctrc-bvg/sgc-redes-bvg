services:
  db:
    image: postgres:16-alpine
    container_name: sgc_redes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgc_redes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trocar_esta_senha_em_producao}
      POSTGRES_DB: ${POSTGRES_DB:-sgc_redes_ifce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sgc_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgc_redes} -d ${POSTGRES_DB:-sgc_redes_ifce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplica as migrações do Prisma e o seed inicial; encerra ao terminar.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: sgc_redes_migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgc_redes}:${POSTGRES_PASSWORD:-trocar_esta_senha_em_producao}@db:5432/${POSTGRES_DB:-sgc_redes_ifce}?schema=public
      SEED_COORDENADOR_EMAIL: ${SEED_COORDENADOR_EMAIL:-}
      SEED_COORDENADOR_SENHA: ${SEED_COORDENADOR_SENHA:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sgc_internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sgc_redes_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgc_redes}:${POSTGRES_PASSWORD:-trocar_esta_senha_em_producao}@db:5432/${POSTGRES_DB:-sgc_redes_ifce}?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Opcional: Webhook para Evolution API / n8n (WhatsApp automático no campus)
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_TOKEN: ${WHATSAPP_WEBHOOK_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - sgc_internal

volumes:
  postgres_data:

networks:
  sgc_internal:
    driver: bridge